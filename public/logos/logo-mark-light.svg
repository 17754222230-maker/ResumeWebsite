<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="王仔研 · 金水相生 W 标">
  <!-- ============================================================
       「金水相生 · W」主标 —— 浅色底版本（白底 / 简历 PDF / 打印 / 第三方浅色场景）
       与深色版同一几何，仅压深色阶：金色在白底对比不足，故由中下段深蓝承担对比度
       ============================================================ -->
  <defs>
    <linearGradient id="jslStroke" gradientUnits="userSpaceOnUse" x1="32" y1="10" x2="32" y2="46">
      <stop offset="0" stop-color="#F0A82E" />
      <stop offset="0.26" stop-color="#E08A2B" />
      <stop offset="0.46" stop-color="#A9895F" />
      <stop offset="0.58" stop-color="#6E8FA8" />
      <stop offset="0.76" stop-color="#2F6F9E" />
      <stop offset="1" stop-color="#163450" />
    </linearGradient>
    <linearGradient id="jslRipple" gradientUnits="userSpaceOnUse" x1="14" y1="51" x2="50" y2="51">
      <stop offset="0" stop-color="#3B78A8" stop-opacity="0" />
      <stop offset="0.5" stop-color="#3B78A8" stop-opacity="0.85" />
      <stop offset="1" stop-color="#3B78A8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <path
    d="M 8 15 L 16.5 37 Q 20 45 23.5 37 L 32 19 L 40.5 37 Q 44 45 47.5 37 L 56 15"
    fill="none"
    stroke="url(#jslStroke)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="miter"
  />
  <path
    d="M 14 51 q 6 -3.5 12 0 t 12 0"
    fill="none"
    stroke="url(#jslRipple)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <circle cx="57" cy="41.7" r="2.8" fill="#E08A2B" />
</svg>
